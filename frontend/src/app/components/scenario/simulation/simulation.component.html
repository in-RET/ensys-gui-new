<section class="simulation-section" [attr.aria-busy]="loading.downloading">
    <div class="save-overlay" *ngIf="loading.downloading">
        <div class="spinner-border text-primary" role="status"></div>
        <span>Creating PDF...</span>
    </div>

    <div #pdfContent id="wrapper" class="p-3 rounded">
        <div class="loading" [hidden]="!loading.page">
            <div
                class="spinner-border text-primary"
                style="width: 3rem; height: 3rem"
                role="status"
            ></div>
            <span class="visually-hidden">Loading...</span>
        </div>

        <!-- Save options -->
        <ng-container *ngIf="!loading.page">
            <div class="py-1 download-btn not-in-pdf">
                <div ngbDropdown class="d-inline-block">
                    <button
                        type="button"
                        class="btn btn-primary"
                        title="Download Dump"
                        id="dropdownBasic1"
                        ngbDropdownToggle
                    >
                        <img
                            src="static/assets/icons/feather/white/download.svg"
                            alt=""
                            class="btn-icon"
                            [hidden]="loading.downloading"
                        />
                    </button>

                    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
                        <div ngbDropdownItem>
                            <button
                                type="button"
                                class="btn btn-primary w-100"
                                (click)="onPrint()"
                            >
                                Print
                            </button>
                        </div>

                        <app-pdf-generator
                            ngbDropdownItem
                            [targetElement]="pdfContent"
                            [btnTxt]="'Download PDF'"
                            fileName="simulation-result.pdf"
                            orientation="landscape"
                            (setLoading)="setLoading($event)"
                        />
                    </div>
                </div>
            </div>
        </ng-container>

        <!-- static cards info -->
        <div class="cards-info gap-3 mb-3">
            <div *ngFor="let static of staticList" class="energy-card">
                <ng-container *ngIf="static.items.length > 0">
                    <div class="energy-card__title">
                        <span *ngIf="static.type.toLowerCase() == 'power'">
                            Installed Powers
                        </span>

                        <span *ngIf="static.type.toLowerCase() == 'energy'">
                            Energy Quantities
                        </span>

                        <span
                            *ngIf="
                                static.type.toLowerCase() == 'costs_emissions'
                            "
                        >
                            Emissions and Costs
                        </span>
                    </div>

                    <div class="energy-card__content">
                        <div
                            class="energy-card__row"
                            *ngFor="let item of static.items"
                        >
                            <span>
                                {{ item.name }}
                            </span>

                            <span>
                                {{ item.value }}
                            </span>

                            <span>
                                {{ item.unit }}
                            </span>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>

        <div class="border-secondary">
            <div id="plotly_div" class="charts-wrapper"></div>
        </div>
    </div>
</section>
