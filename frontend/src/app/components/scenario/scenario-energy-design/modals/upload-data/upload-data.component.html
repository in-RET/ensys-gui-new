<app-modal
    [title]="'Upload Data'"
    *ngIf="modalInfo"
    (closeModal)="closeModal(false)"
>
    <div modal-form>
        <div class="d-flex align-items-center justify-content-center">
            <textarea
                #dataTextarea
                name="data"
                id="data"
                placeholder="Enter data to upload..."
                rows="10"
                class="form-control"
                [(ngModel)]="data"
            ></textarea>
        </div>
    </div>

    <div modal-actions>
        <span class="text-danger modal_error" *ngIf="formError.isShow">
            {{ formError.msg }}
        </span>

        <button
            type="submit"
            class="btn btn--success btn--medium"
            (click)="onSubmitData()"
        >
            <span>Submit</span>
        </button>
    </div>

    <ng-template #empty_form_actions>
        <button
            type="button"
            class="btn btn--primary btn--medium"
            (click)="closeModal(false)"
        >
            <span>Close</span>
        </button>
    </ng-template>
</app-modal>
