<!-- action btns -->
<section class="d-flex gap-1 justify-content-center p-3">
    <!-- Create Project -->
    <button
        type="button"
        class="btn btn--medium btn--success"
        [routerLink]="['../project']"
        aria-label="Create project"
        *ngIf="currentExploreRoute == 'projects'"
        style="position: absolute; left: 0; margin-left: 3rem"
    >
        <img
            src="static/assets/icons/feather/white/plus.svg"
            alt=""
            height="20"
            width="20"
            loading="lazy"
        />
        <span>Create Project</span>
    </button>

    <!-- show Projects/Templates -->
    <div class="btn-group" role="group" aria-label="Basic outlined example">
        <button
            type="button"
            class="btn"
            [routerLink]="['projects']"
            aria-label="Browse projects"
            [ngClass]="{ 'btn--hollow': currentExploreRoute !== 'projects' }"
            (click)="removeFocus($event)"
        >
            Projects
        </button>

        <button
            type="button"
            class="btn"
            [routerLink]="['templates']"
            aria-label="Browse templates"
            [ngClass]="{ 'btn--hollow': currentExploreRoute !== 'templates' }"
            (click)="removeFocus($event)"
        >
            Templates
        </button>
    </div>

    <!-- sort options -->
    <div
        ngbDropdown
        class="d-inline-block"
        style="position: absolute; right: 0; margin-right: 3rem"
    >
        <button
            type="button"
            class="btn btn--hollow d-flex align-items-center"
            id="dropdownBasic1"
            ngbDropdownToggle
        >
            {{
                currentExploreRoute === "projects"
                    ? (exploreService.exploreProject_selectedSortOption | async)
                    : null
            }}
            {{
                currentExploreRoute === "templates"
                    ? (exploreService.exploreTemplate_selectedSortOption
                      | async)
                    : null
            }}
        </button>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
            <button
                ngbDropdownItem
                *ngFor="let option of sortOptions"
                (click)="orderItemsBy(option)"
                [disabled]="option !== 'A-Z' && option !== 'Z-A'"
            >
                {{ option }}
            </button>
        </div>
    </div>
</section>

<router-outlet />
